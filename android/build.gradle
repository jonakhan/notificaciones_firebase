// android/build.gradle

buildscript {
     ext.kotlin_version = "2.1.10"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:7.0.4" // Asegúrate de que esta línea esté presente
        classpath "com.google.gms:google-services:4.4.2" // Asegúrate de que esta línea esté presente
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version" // Asegúrate de que esta línea esté presente
         

    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}